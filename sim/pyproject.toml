[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yantrasim"
version = "0.1.0"
description = "Warehouse AMR fleet simulator emitting VDA 5050 v2.1 state (Supabase or MQTT transport)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "yantracore"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["yantrasim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
