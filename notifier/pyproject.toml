[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yantranotify"
version = "0.1.0"
description = "Omnichannel alert notifier: unacked crit/serious alerts + open incidents -> console / webhook / WhatsApp (Twilio REST)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "yantracore",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yantranotify = "yantranotify.__main__:main"

[tool.setuptools]
packages = ["yantranotify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
