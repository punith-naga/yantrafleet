[project]
name = "yantrabridge"
version = "0.1.0"
description = "VDA 5050 v2.1 state -> Supabase connector for YantraFleet"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
yantrabridge = "yantrabridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["yantrabridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
