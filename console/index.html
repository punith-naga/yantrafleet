<!DOCTYPE html>
<!-- ================================================================
  YantraFleet CONSOLE — FleetMind ops console + Sarathi copilot bridge
  =================================================================
  CONFIG (all optional — the console degrades gracefully):

  1. Sarathi live agent (Copilot backend)
     - Endpoint : POST http://localhost:8001/ask   (see Copilot.SARATHI_URL)
     - Request  : {"question": "<operator question>"}
     - Response : {"answer": string,
                   "evidence": [string | {label, ...}],   // rendered as chips
                   "tier": "grounded" | "llm_only" | "offline"}
       tier is shown as a pill: grounded/live_agent -> "live agent",
       llm_only/model_only -> "model only", offline -> "offline".
     - Timeout  : 4000 ms (Copilot.SARATHI_TIMEOUT_MS). On ANY failure
       (down, non-2xx, timeout, bad JSON) the Copilot silently falls back
       to the built-in local answer engine — the console never breaks
       if the sarathi service is not running.
     - To change host/port, edit Copilot.SARATHI_URL in the Copilot
       module below. If the console is served from https, a plain-http
       localhost endpoint may be blocked as mixed content — serve the
       console over http (e.g. `python3 -m http.server`) for local dev.

  2. Supabase sync (optional multi-tab live sync)
     - SUPA_URL / SUPA_KEY constants near the bottom of the script.
     - If unreachable, the console runs its local simulation.

  No build step. Open index.html directly or serve statically.
  ================================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetMind — Fleet Operations (Live)</title>
<style>
/* ============ Design tokens (dark ops console — deliberate single-theme, ISA-101) ============ */
:root{
  --page:#0d0d0d; --surface:#1a1a19; --surface2:#222221; --surface3:#2a2a28;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;   /* categorical, dark-stepped */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --accent:#3987e5;
  --r:8px; --r-sm:6px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#333;border-radius:6px;border:2px solid var(--page)}
::-webkit-scrollbar-track{background:transparent}

/* ============ App shell ============ */
#app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.01em;min-width:180px}
.logo .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3987e5,#199e70);display:grid;place-items:center;font-size:13px}
.site-sel{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 12px;color:var(--ink2);font-size:12.5px}
.site-sel b{color:var(--ink)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--ink2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.kbd{background:var(--surface3);border:1px solid var(--border2);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--muted);font-family:inherit}
.copilot-btn{display:flex;align-items:center;gap:8px;background:#12253f;border:1px solid #2a4a75;color:#9ec5f4;border-radius:var(--r-sm);padding:6px 13px;font-size:12.5px;font-weight:600}
.copilot-btn:hover{background:#173050}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#d95926,#c98500);display:grid;place-items:center;font-size:11px;font-weight:700}

/* ============ Sidebar ============ */
nav{background:var(--surface);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 12px 5px}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--ink2);padding:8px 12px;border-radius:var(--r-sm);font-size:13px;text-align:left}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--surface3);color:var(--ink);font-weight:600}
nav button .ic{width:17px;text-align:center;opacity:.85;font-style:normal}
nav button .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 6px;min-width:17px;text-align:center}
nav button .badge.z{background:var(--surface3);color:var(--muted)}
.nav-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}

/* ============ Main ============ */
main{overflow:hidden;position:relative;display:flex}
.view{display:none;flex:1;overflow-y:auto;padding:20px 22px}
.view.on{display:block}
.vhead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.vhead h1{font-size:17px;font-weight:700}
.vhead .sub{color:var(--muted);font-size:12.5px}
.vhead .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ============ Components ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h3{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11.5px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g31{grid-template-columns:2.2fr 1fr}
.g13{grid-template-columns:1fr 2.2fr}
.stat .val{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .val small{font-size:13px;color:var(--muted);font-weight:500}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.stat .delta{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:5px}
.up{color:#0ca30c}.down{color:var(--crit)}.flat{color:var(--muted)}
.btn{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);border-radius:var(--r-sm);padding:6px 13px;font-size:12.5px;font-weight:600}
.btn:hover{background:var(--surface3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn.danger{border-color:#5c2a2a;color:#e66767}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{color:var(--muted);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface2)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap}
.st .ic{font-size:11px;font-style:normal}
.sev{display:inline-flex;align-items:center;gap:5px;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.sev.crit{background:#3a1616;color:#e66767}
.sev.serious{background:#33200f;color:var(--serious)}
.sev.warn{background:#332a10;color:var(--warn)}
.sev.info{background:var(--surface3);color:var(--ink2)}
.bar-track{background:var(--surface3);border-radius:4px;height:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.pill{font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 7px}
.evd{display:inline-flex;align-items:center;gap:4px;background:#12253f;border:1px solid #2a4a75;color:#9ec5f4;border-radius:4px;padding:1px 8px;font-size:11px;font-weight:600;cursor:pointer}
.evd:hover{background:#173050}
.empty{color:var(--muted);font-size:12.5px;padding:14px;text-align:center}

/* ============ Map ============ */
.mapwrap{position:relative;background:#141413;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.map-legend{position:absolute;left:12px;bottom:10px;display:flex;gap:14px;font-size:11px;color:var(--ink2);background:rgba(20,20,19,.85);border:1px solid var(--border);border-radius:6px;padding:5px 12px}
.map-legend .it{display:flex;align-items:center;gap:6px}
svg text{font-family:var(--font)}
.robot-dot{cursor:pointer}
.zone-lbl{fill:#5b5a55;font-size:11px;font-weight:600;letter-spacing:.06em}

/* ============ Drawer ============ */
.drawer{position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--surface);border-left:1px solid var(--border2);transform:translateX(105%);transition:transform .22s ease;z-index:30;display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.45)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer .dh h2{font-size:15px}
.drawer .db{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.kv b{font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}

/* ============ Copilot panel ============ */
#copilot{position:absolute;top:0;right:0;bottom:0;width:390px;background:var(--surface);border-left:1px solid var(--border2);transform:translateX(105%);transition:transform .22s ease;z-index:40;display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.5)}
#copilot.open{transform:none}
.cp-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.cp-head .t{font-weight:700;font-size:14px}
.cp-head .s{font-size:11px;color:var(--muted)}
.cp-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;border-radius:10px;padding:10px 13px;font-size:12.8px;line-height:1.55}
.msg.user{align-self:flex-end;background:#1c3a63;border:1px solid #2a4a75}
.msg.ai{align-self:flex-start;background:var(--surface2);border:1px solid var(--border)}
.msg.ai .ev{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.msg.ai ul{margin:6px 0 2px 16px}
.msg.ai li{margin:2px 0}
.msg.ai b{color:#9ec5f4}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;background:var(--surface2);border:1px solid var(--border);color:var(--ink2);border-radius:var(--r-sm);padding:8px 11px;font-size:12px}
.sugg button:hover{border-color:#2a4a75;color:var(--ink)}
.cp-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.cp-input input{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--ink);padding:9px 12px;font-size:13px;font-family:inherit;outline:none}
.cp-input input:focus{border-color:#2a4a75}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.25}50%{opacity:1}}

/* ============ Alerts feed ============ */
.al{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);align-items:flex-start;font-size:12.5px}
.al:last-child{border-bottom:none}
.al .tt{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.al .bd{flex:1}
.al .bd .m{color:var(--ink2)}
.al.unack .bd .m{color:var(--ink)}
.al .ack{opacity:0;transition:opacity .15s}
.al:hover .ack{opacity:1}
.al.acked{opacity:.45}

/* ============ Charts ============ */
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:#242423;border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:11.5px;display:none;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.4);white-space:nowrap}
.tip .h{color:var(--muted);font-size:10.5px;margin-bottom:3px}
.tip .row{display:flex;align-items:center;gap:6px}
.tip .sw{width:8px;height:8px;border-radius:2px}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:6px}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .sw{width:9px;height:9px;border-radius:2px}

/* ============ Timeline replay ============ */
.scrub{display:flex;align-items:center;gap:12px;margin-top:10px}
.scrub input[type=range]{flex:1;accent-color:var(--accent)}
.scrub .tm{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink2);min-width:52px}
.tl-events{position:relative;height:22px;margin:2px 2px 0}
.tl-ev{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);cursor:pointer;border:2px solid var(--page)}

/* ============ Toast ============ */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:10px 14px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ============ Command palette ============ */
#palette{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:none;align-items:flex-start;justify-content:center;padding-top:11vh}
#palette.open{display:flex}
.pal-box{width:540px;max-width:92vw;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden}
.pal-box input{width:100%;background:var(--surface3);border:none;border-bottom:1px solid var(--border2);color:var(--ink);padding:13px 15px;font-size:14px;font-family:inherit;outline:none}
#pal-list{max-height:330px;overflow-y:auto;padding:6px}
.pal-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:12.8px;color:var(--ink2);cursor:pointer}
.pal-it .ic{width:18px;text-align:center;font-style:normal;opacity:.8}
.pal-it .hint{margin-left:auto;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pal-it.sel{background:var(--surface3);color:var(--ink)}
.pal-empty{padding:14px;color:var(--muted);font-size:12.5px;text-align:center}
.pal-foot{padding:7px 12px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted);display:flex;gap:12px}

/* ============ First-run tour ============ */
#tour-block{position:fixed;inset:0;z-index:300;display:none}
#tour-hl{position:fixed;z-index:301;display:none;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.62);pointer-events:none;transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease}
#tour-card{position:fixed;z-index:302;display:none;width:296px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6);font-size:12.5px}
#tour-card h4{font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
#tour-card h4 .n{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:500}
#tour-card p{color:var(--ink2);line-height:1.5}
#tour-card .row{display:flex;gap:8px;margin-top:12px;align-items:center}
#tour-card .row .sk{margin-right:auto}

@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g31,.g13,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="logo"><div class="mark">⬡</div>FleetMind <span class="pill" style="margin-left:2px">DEMO · mock data</span></div>
  <div class="site-sel">📍 <b>BLR-DC1</b> · Bengaluru Fulfillment Center <span style="color:var(--muted)">▾</span></div>
  <div class="spacer"></div>
  <div class="chip" id="chip-health"><span class="dot" style="background:var(--good)"></span>Fleet health <b id="h-health" style="color:var(--ink)">—</b></div>
  <div class="chip" title="ISA-18.2 alarm budget: ≤12/hr per operator"><span id="alarm-dot" class="dot" style="background:var(--good)"></span><span id="h-alarmrate">— alarms/hr</span></div>
  <div class="chip" id="h-clock">14:32</div>
  <div class="chip" id="chip-cloud" title="Supabase sync status"><span class="dot" id="cloud-dot" style="background:var(--muted)"></span><span id="cloud-lbl">connecting…</span></div>
  <button class="copilot-btn" id="btn-copilot" onclick="Copilot.toggle()">✦ Copilot <span class="kbd">⌘J</span></button>
  <button class="btn ghost sm" id="btn-tour" title="Replay the first-run tour" onclick="Tour.start()">?</button>
  <div class="avatar">PN</div>
</header>
<nav id="nav">
  <div class="sec">Operate</div>
  <button data-v="overview" class="on"><i class="ic">◫</i>Overview</button>
  <button data-v="liveops"><i class="ic">⌖</i>Live Ops</button>
  <button data-v="incidents"><i class="ic">⚠</i>Incidents <span class="badge" id="n-inc">3</span></button>
  <button data-v="missions"><i class="ic">➤</i>Missions</button>
  <div class="sec">Improve</div>
  <button data-v="maint"><i class="ic">🔧</i>Maintenance <span class="badge z" id="n-maint">2</span></button>
  <button data-v="analytics"><i class="ic">∿</i>Analytics</button>
  <div class="sec">Configure</div>
  <button data-v="fleet"><i class="ic">⬡</i>Fleet &amp; Connectors</button>
  <div class="nav-foot">v0.1 demo · VDA 5050 · 3 vendors<br><span style="color:#0ca30c">●</span> Sim feed connected</div>
</nav>
<main id="main">
  <div class="view on" id="v-overview"></div>
  <div class="view" id="v-liveops"></div>
  <div class="view" id="v-incidents"></div>
  <div class="view" id="v-missions"></div>
  <div class="view" id="v-maint"></div>
  <div class="view" id="v-analytics"></div>
  <div class="view" id="v-fleet"></div>
  <div class="drawer" id="drawer"></div>
  <div id="copilot"></div>
</main>
</div>
<div id="toasts"></div>
<div class="tip" id="tip"></div>
<script>
"use strict";
/* ================================================================
   FleetMind demo — all mock. Architecture mirrors the real product:
   Sim (→ later: MQTT/VDA5050 ingest) → Store → Views + Copilot
   ================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>n.toLocaleString('en-IN');
const pad=n=>String(n).padStart(2,'0');
let simMin = 14*60+32;                       // sim clock 14:32
const clock=()=>`${pad(Math.floor(simMin/60)%24)}:${pad(Math.floor(simMin%60))}`;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------------- Warehouse geometry (SVG coords 1000x520) ---------------- */
const ZONES=[
  {n:'INBOUND',x:20,y:40,w:130,h:440,c:'#191c22'},
  {n:'STORAGE A',x:180,y:40,w:290,h:200,c:'#17181c'},
  {n:'STORAGE B',x:180,y:280,w:290,h:200,c:'#17181c'},
  {n:'PACK',x:510,y:40,w:200,h:440,c:'#191b18'},
  {n:'OUTBOUND',x:850,y:40,w:130,h:280,c:'#191c22'},
  {n:'CHARGE',x:850,y:360,w:130,h:120,c:'#141a14'},
];
const RACKS=[]; // storage racks
for(let r=0;r<3;r++){for(let z=0;z<2;z++){RACKS.push({x:200,y:60+z*240+r*62,w:250,h:26});}}
for(let r=0;r<5;r++){RACKS.push({x:530,y:60+r*84,w:70,h:40});RACKS.push({x:620,y:60+r*84,w:70,h:40});}
// waypoint nodes robots travel between (aisles)
const WP={
  in1:[85,120], in2:[85,300], in3:[85,440],
  a1:[185,105],a2:[330,105],a3:[460,105],a4:[185,168],a5:[330,168],a6:[460,168],
  b1:[185,345],b2:[330,345],b3:[460,345],b4:[185,408],b5:[330,408],b6:[460,408],
  mid1:[490,120],mid2:[490,260],mid3:[490,420],

function route(from,to){ // BFS
  const q=[[from]],seen=new Set([from]);
  while(q.length){const p=q.shift(),n=p[p.length-1];
    if(n===to)return p;
    for(const m of (ADJ[n]||[]))if(!seen.has(m)){seen.add(m);q.push([...p,m]);}}
  return [from];
}

/* ---------------- Simulation tick ---------------- */
let speedMult=1, tick=0;
function step(dt){
  simMin+=dt*speedMult*0.5;  tick++;
  for(const r of robots){
    r.batHist.push(r.battery); if(r.batHist.length>120)r.batHist.shift();
    if(r.status==='charging'){r.battery=Math.min(100,r.battery+0.15*speedMult);r.speed=0;
      if(r.battery>=85){r.status='active';r.node='chg1';assign(r);r.log.unshift([clock(),'Charge complete → resuming tasks']);}
    }else if(r.status==='fault'||r.status==='paused'){r.speed=0;
    }else{ // active — move along path
      if(!r.path.length||r.seg>=r.path.length-1){ r.tasksDone++; r.node=r.path[r.path.length-1]||r.node;
        if(r.battery<30){r.status='charging';r.path=route(r.node,'chg2');r.seg=0;r.prog=0;r.task=null;
          r.log.unshift([clock(),'Battery '+r.battery.toFixed(0)+'% → autonomous charge']);}
        else assign(r);
        continue;}
      const a=WP[r.path[r.seg]],b=WP[r.path[r.seg+1]];
      const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
      r.speed=r.speedMax*rnd(.82,1);
      r.prog+=(r.speed*22*dt*speedMult)/len;
      if(r.prog>=1){r.prog=0;r.seg++;r.node=r.path[r.seg];}
      const p=Math.min(r.prog,1);
      r.pos=[a[0]+dx*p,a[1]+dy*p];
      r.battery=Math.max(5,r.battery-0.012*speedMult);
      r.motorTemp=Math.min(70,r.motorTemp+rnd(-.1,.12));
    }
    r.spdHist.push(r.speed);if(r.spdHist.length>40)r.spdHist.shift();
  }
  // KPIs
  const active=robots.filter(r=>r.status==='active').length;
  const recovering=simMin<14*60+40;
  store.throughput=Math.round(112+active*3.2+Math.sin(simMin/8)*5+(recovering?-6:2)+rnd(-2,2));
  if(tick%4===0){store.thrHist.push({t:simMin,v:store.throughput});if(store.thrHist.length>60)store.thrHist.shift();}
  store.alarmHr=Math.max(2,Math.round(store.alerts.filter(a=>!a.ack&&typeof a.t==='number'&&simMin-a.t<60).length+2));
  // occasional ambient events
  if(tick%90===0){const r=robots[Math.floor(rnd(0,10))];if(r.status==='active')pushAlert('info','Path re-planned for '+r.id+' (congestion avoidance)',r.id);}
  if(tick%140===70)pushAlert('warn',robots[4].id+' pick verification retry at '+robots[4].node.toUpperCase(),robots[4].id);
}

const tip=$('#tip');

function lineChart(el,data,{h=150,color='var(--s1)',unit='',label='value',fmtX=t=>clock2(t)}={}){
  const w=el.clientWidth||600, P={l:34,r:8,t:8,b:20};
  const vs=data.map(d=>d.v), min=Math.min(...vs), max=Math.max(...vs), pad=(max-min)*0.15||10;
  const y0=Math.max(0,min-pad), y1=max+pad;
  const X=i=>P.l+(i/(data.length-1))*(w-P.l-P.r);
  const Y=v=>P.t+(1-(v-y0)/(y1-y0))*(h-P.t-P.b);
  let grid='',ticks='';
  for(let g=0;g<4;g++){const v=y0+(y1-y0)*g/3, y=Y(v);
    grid+=`<line x1="${P.l}" x2="${w-P.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    ticks+=`<text x="${P.l-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${Math.round(v)}</text>`;}
  const lbls=[0,Math.floor(data.length/2),data.length-1].map(i=>`<text x="${X(i)}" y="${h-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtX(data[i].t)}</text>`).join('');
  const pts=data.map((d,i)=>`${X(i).toFixed(1)},${Y(d.v).toFixed(1)}`).join(' ');
  const area=`M${X(0)},${Y(data[0].v)} L${pts.split(' ').join(' L')} L${X(data.length-1)},${h-P.b} L${X(0)},${h-P.b} Z`;
  el.innerHTML=`<svg width="${w}" height="${h}" style="display:block">
    ${grid}${ticks}${lbls}
    <path d="${area}" fill="${color}" opacity="0.10"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <line id="ch-x" y1="${P.t}" y2="${h-P.b}" stroke="var(--border2)" stroke-width="1" style="display:none"/>
    <circle id="ch-dot" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2" style="display:none"/>
    <rect x="${P.l}" y="${P.t}" width="${w-P.l-P.r}" height="${h-P.t-P.b}" fill="transparent" class="hov"/>
  </svg>`;
  const svg=el.querySelector('svg'),hov=el.querySelector('.hov'),xl=el.querySelector('#ch-x'),dot=el.querySelector('#ch-dot');
  hov.addEventListener('mousemove',e=>{
    const bx=svg.getBoundingClientRect();
    const i=Math.round(((e.clientX-bx.left)-P.l)/((w-P.l-P.r)/(data.length-1)));
    const j=Math.max(0,Math.min(data.length-1,i)), d=data[j];
    xl.setAttribute('x1',X(j));xl.setAttribute('x2',X(j));xl.style.display='block';
    dot.setAttribute('cx',X(j));dot.setAttribute('cy',Y(d.v));dot.style.display='block';
    showTip(`<div class="h">${fmtX(d.t)}</div><div class="row"><span class="sw" style="background:${color.startsWith('var')?'#3987e5':color}"></span>${label}&nbsp;<b>${d.v}${unit}</b></div>`,e.clientX,e.clientY);});
  hov.addEventListener('mouseleave',()=>{xl.style.display='none';dot.style.display='none';hideTip();});
}
const clock2=t=>typeof t==='number'?`${pad(Math.floor(t/60)%24)}:${pad(Math.floor(t%60))}`:t;

function spark(vals,{w=110,h=26,color='var(--s1)'}={}){
  if(!vals.length)return '';
  const min=Math.min(...vals),max=Math.max(...vals),rg=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-2-((v-min)/rg)*(h-6)}`).join(' ');
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function hbar(el,rows,{unit='',color='var(--s1)'}={}){ // horizontal bars, rounded data-end
  const max=Math.max(...rows.map(r=>r.v))||1;

/* ---- v0.3 real-telemetry replay (robot_telemetry via PostgREST) ----
   When an incident opens and the cloud is reachable, fetch the src robot's
   recorded telemetry in [start−2min, start+max(dur,10)min] and drive the
   replay UI (scrubber, marker, trail, charts, event dots) from real samples.
   Fewer than 10 samples, or any fetch failure → the scripted INC-1042 demo
   replay stays, with a small note. */
let RP=null, rpReq=0;   // RP = active real-replay model {inc,robotId,samples,events,cursors}
function lttbIdx(ts,vs,thr){ // Largest-Triangle-Three-Buckets — returns kept indices
  const n=ts.length; if(thr>=n||thr<3)return ts.map((_,i)=>i);
  const out=[0], bkt=(n-2)/(thr-2); let a=0;
  for(let i=0;i<thr-2;i++){
    let s=Math.floor((i+1)*bkt)+1, e=Math.min(Math.floor((i+2)*bkt)+1,n);
    let avT=0,avV=0,c=0; for(let j=s;j<e;j++){avT+=ts[j];avV+=vs[j];c++;}
    if(c){avT/=c;avV/=c;}else{avT=ts[n-1];avV=vs[n-1];}
    const s0=Math.floor(i*bkt)+1, e0=Math.min(Math.floor((i+1)*bkt)+1,n);
    let best=s0, bestA=-1;
    for(let j=s0;j<e0;j++){
      const ar=Math.abs((ts[a]-avT)*(vs[j]-vs[a])-(ts[a]-ts[j])*(avV-vs[a]));
      if(ar>bestA){bestA=ar;best=j;}
    }
    out.push(best); a=best;
  }
  out.push(n-1); return out;
}
function rpNote(inc){ // fallback note under the (possibly scripted) replay block
  if(curInc!==inc.id)return;
  const el=$('#rp-note'); if(!el)return;
  el.textContent=inc.id==='INC-1042'?'scripted demo replay (no telemetry recorded)'
    :'no telemetry recorded for this incident — replay unavailable';
}
async function loadRealReplay(inc){
  const req=++rpReq; RP=null;
  const live=typeof Sync!=='undefined'&&Sync.mode!=='local'&&Sync.mode!=='connecting';
  if(!live||!inc.created_at){rpNote(inc);return;}
  try{
    const anchor=new Date(inc.created_at).getTime();
    if(!isFinite(anchor)){rpNote(inc);return;}
    const t0=new Date(anchor-2*60000).toISOString();
    const t1=new Date(anchor+Math.max(+inc.dur||0,10)*60000).toISOString();
    const enc=encodeURIComponent;
    const rows=await Sync.q(`robot_telemetry?robot_id=eq.${enc(inc.src)}&ts=gte.${enc(t0)}&ts=lte.${enc(t1)}&order=ts.asc&limit=2000&select=ts,battery,speed,motor_temp,status,pos`);
    if(req!==rpReq)return;                                   // another incident opened meanwhile
    if(!rows||rows.length<10){rpNote(inc);return;}
    let S=rows.map(r=>({tms:new Date(r.ts).getTime(),
      battery:r.battery==null?null:+r.battery, speed:r.speed==null?null:+r.speed,
      status:r.status, pos:posToSvg(r.pos)}));
    // forward/backfill missing positions (hold last fix — never fabricate motion)
    let last=null;
    S.forEach(s=>{if(Array.isArray(s.pos)&&s.pos.length===2&&isFinite(+s.pos[0])&&isFinite(+s.pos[1])){s.pos=[+s.pos[0],+s.pos[1]];last=s.pos;}else s.pos=last;});
    const first=S.find(s=>s.pos); if(!first){rpNote(inc);return;}
    S.forEach(s=>{if(!s.pos)s.pos=first.pos;});
    // downsample to ≤300 points for scrubbing — LTTB keeps incident spikes visible
    if(S.length>300){
      const keep=lttbIdx(S.map(s=>s.tms),S.map(s=>s.battery!=null?s.battery:(s.speed!=null?s.speed:0)),300);
      S=keep.map(k=>S[k]);
    }
    // timeline event dots: that robot's alerts inside the window
    let evs=[];
    try{
      const al=await Sync.q(`alerts?src=eq.${enc(inc.src)}&created_at=gte.${enc(t0)}&created_at=lte.${enc(t1)}&order=created_at.asc&limit=40&select=sev,msg,created_at`);
      const T0=S[0].tms, T1=S[S.length-1].tms;
      evs=(al||[]).map(a=>({frac:Math.max(0,Math.min(1,(new Date(a.created_at).getTime()-T0)/((T1-T0)||1))),sev:a.sev,msg:a.msg}));
    }catch(e){/* alerts optional */}
    if(req!==rpReq)return;
    RP={inc:inc.id,robotId:inc.src,samples:S,events:evs,cursors:[]};
    if(curInc===inc.id&&curView==='incidents')renderRealReplay();
  }catch(e){ if(req===rpReq)rpNote(inc); }
}
function renderRealReplay(){
  const wrap=$('#rp-wrap'); if(!wrap||!RP)return;
  wrap.innerHTML=`
    <h3 style="margin-top:16px">Incident replay — recorded telemetry · ${RP.samples.length} samples</h3>
    <div class="mapwrap"><svg id="replay-map" style="display:block;width:100%;max-height:230px"></svg></div>
    <div class="tl-events" id="tl-ev"></div>
    <div class="scrub"><button class="btn sm" id="rp-play" onclick="replayPlay()">▶</button>
      <input type="range" id="rp-range" min="0" max="100" value="${+replayT||0}" step="0.5" oninput="replaySeek(this.value)">
      <span class="tm" id="rp-time">—</span></div>
    <div class="grid g2" style="margin-top:10px">
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">${RP.robotId} battery (%)</div><div class="chart" id="rp-bat"></div></div>
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">${RP.robotId} speed (m/s)</div><div class="chart" id="rp-spd"></div></div>
    </div>`;
  const nt=$('#rp-note'); if(nt)nt.textContent='replay driven by recorded robot_telemetry for '+RP.robotId+' · event dots = alerts in window';
  drawRealReplay();
  $('#tl-ev').innerHTML=RP.events.map(e=>`<div class="tl-ev" style="left:${(e.frac*100).toFixed(1)}%;background:${e.sev==='crit'?'var(--crit)':e.sev==='serious'?'var(--serious)':e.sev==='warn'?'var(--warn)':'var(--muted)'}" title="${Copilot.esc(e.msg||'')}" onclick="replaySeek(${(e.frac*100).toFixed(1)})"></div>`).join('');
  const fmtT=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
  lineChart($('#rp-bat'),RP.samples.map(s=>({t:s.tms,v:Math.round(s.battery!=null?s.battery:0)})),{h:110,color:'var(--s3)',unit:'%',label:'battery',fmtX:fmtT});
  lineChart($('#rp-spd'),RP.samples.map(s=>({t:s.tms,v:+(s.speed!=null?s.speed:0).toFixed(2)})),{h:110,color:'var(--s1)',label:'m/s',fmtX:fmtT});
  RP.cursors=[addReplayCursor($('#rp-bat')),addReplayCursor($('#rp-spd'))];
  replaySeek(+replayT||0);
}
function drawRealReplay(){ // warehouse base auto-framed on the robot's recorded path
  const svg=$('#replay-map'); if(!svg||!RP)return;
  const xs=RP.samples.map(s=>s.pos[0]), ys=RP.samples.map(s=>s.pos[1]);
  let x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  const px=Math.max(50,(x1-x0)*.25), py=Math.max(40,(y1-y0)*.25);
  x0-=px;x1+=px;y0-=py;y1+=py;
  if(x1-x0<320){const c=(x0+x1)/2;x0=c-160;x1=c+160;}
  if(y1-y0<170){const c=(y0+y1)/2;y0=c-85;y1=c+85;}
  svg.setAttribute('viewBox',`${x0.toFixed(0)} ${y0.toFixed(0)} ${(x1-x0).toFixed(0)} ${(y1-y0).toFixed(0)}`);
  const pts=RP.samples.map(s=>s.pos[0].toFixed(1)+','+s.pos[1].toFixed(1)).join(' ');
  svg.innerHTML=`<rect x="${x0.toFixed(0)}" y="${y0.toFixed(0)}" width="${(x1-x0).toFixed(0)}" height="${(y1-y0).toFixed(0)}" fill="#141413"/>`
    +mapBaseSvgStr()
    +`<polyline points="${pts}" fill="none" stroke="var(--s2)" stroke-width="2" opacity=".25"/>`
    +`<polyline id="rp-trail" points="" fill="none" stroke="var(--s2)" stroke-width="2" stroke-dasharray="4 3" opacity=".85"/>`
    +`<g id="rp-bot"><circle r="10" fill="var(--s2)" stroke="var(--page)" stroke-width="2"/><text y="3.5" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0d0d0d">${RP.robotId.slice(-2)}</text></g>`;
}
function addReplayCursor(el){ // vertical time cursor over a lineChart; returns frac→x updater
  const svg=el&&el.querySelector('svg'); if(!svg)return null;
  const w=+svg.getAttribute('width'), h=+svg.getAttribute('height');
  const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
  ln.setAttribute('y1',8); ln.setAttribute('y2',h-20);
  ln.setAttribute('stroke','var(--accent)'); ln.setAttribute('stroke-width','1.5'); ln.setAttribute('opacity','.8');
  svg.appendChild(ln);
  return f=>{const x=34+f*(w-34-8);ln.setAttribute('x1',x.toFixed(1));ln.setAttribute('x2',x.toFixed(1));};
}
function replaySeekReal(v){
  const S=RP.samples, n=S.length;
  const f=Math.max(0,Math.min(1,(+v||0)/100)), fp=f*(n-1), idx=Math.floor(fp), fr=fp-idx;
  const a=S[idx], b=S[Math.min(idx+1,n-1)];
  const x=a.pos[0]+(b.pos[0]-a.pos[0])*fr, y=a.pos[1]+(b.pos[1]-a.pos[1])*fr;
  const bot=$('#rp-bot'); if(bot)bot.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)})`);
  const trail=$('#rp-trail'); if(trail)trail.setAttribute('points',S.slice(0,idx+1).map(s=>s.pos[0].toFixed(1)+','+s.pos[1].toFixed(1)).join(' ')+` ${x.toFixed(1)},${y.toFixed(1)}`);
  const d=new Date(a.tms+(b.tms-a.tms)*fr);
  const t=$('#rp-time'); if(t)t.textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  (RP.cursors||[]).forEach(u=>{if(u)u(n>1?fp/(n-1):0);});
}

const Copilot={
  open:false, msgs:[],
  toggle(){this.open=!this.open;$('#copilot').classList.toggle('open',this.open);if(this.open)this.render();},
  render(){
    const c=$('#copilot');
    c.innerHTML=`
    <div class="cp-head"><div style="width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3987e5,#9085e9);display:grid;place-items:center">✦</div>

    <div class="cp-body" id="cp-body">
      ${this.msgs.length?'':`<div class="msg ai">Hi Punith — I'm watching all 10 robots. Ask me anything about the fleet, or try:</div>
      <div class="sugg">
        <button onclick="Copilot.ask('Why did throughput drop after 14:00?')">Why did throughput drop after 14:00?</button>
        <button onclick="Copilot.ask('Which robot needs service next?')">Which robot needs service next?</button>
        <button onclick="Copilot.ask('Draft the shift handover report')">Draft the shift handover report</button>
        <button onclick="Copilot.ask('How is the fleet doing right now?')">How is the fleet doing right now?</button>
      </div>`}
      ${this.msgs.map(m=>m.html).join('')}
    </div>
    <div class="cp-input"><input id="cp-in" placeholder="Ask about your fleet…" onkeydown="if(event.key==='Enter')Copilot.ask(this.value)">
      <button class="btn primary" onclick="Copilot.ask($('#cp-in').value)">Send</button></div>`;
    const b=$('#cp-body');b.scrollTop=b.scrollHeight;
  },
  /* ---- Sarathi live-agent bridge (see CONFIG block at top of file) ----
     Tries the sarathi service first; on ANY failure falls back to the
     local rule-based answer(q) engine below (unchanged). */
  SARATHI_URL:'http://localhost:8001/ask',
  SARATHI_TIMEOUT_MS:4000,
  esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},
  /** POST {question} to sarathi with a hard timeout; resolves {answer,evidence,tier} or throws. */
  async askRemote(q){
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),this.SARATHI_TIMEOUT_MS);
    try{
      const r=await fetch(this.SARATHI_URL,{method:'POST',signal:c.signal,
        headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      if(!d||typeof d.answer!=='string')throw new Error('bad payload: missing answer');
      return d;
    }finally{clearTimeout(t);}
  },
  /** Small tier pill: 'live agent' (green) / 'model only' (amber) / 'offline' (grey). */
  tierPill(tier){
    const key=String(tier||'').toLowerCase().replace(/[\s-]+/g,'_');
    const m={live_agent:['live agent','#199e70'],grounded:['live agent','#199e70'],
             model_only:['model only','#c98500'],llm_only:['model only','#c98500'],
             offline:['offline','#898781']};
    const [lbl,c]=m[key]||[this.esc(tier||'live agent'),'#3987e5'];
    return `<span class="pill" style="color:${c};border-color:${c}66">${lbl}</span>`;
  },
  /** Render a sarathi {answer, evidence[], tier} payload as a copilot message body.
      Evidence items may be strings or objects with a label/id/source field —
      they are rendered with the console's existing .evd chip style. */
  renderRemote(d){
    const ans=this.esc(d.answer).replace(/\n/g,'<br>');
    const evs=(Array.isArray(d.evidence)?d.evidence:[]).map(e=>{
      const lbl=typeof e==='string'?e:(e&&(e.label||e.id||e.source||e.title))||'evidence';
      return `<span class="evd">${this.esc(lbl)}</span>`;
    }).join('');
    return `${ans}${evs?`<div class="ev">${evs}</div>`:''}<div style="margin-top:7px">${this.tierPill(d.tier)}</div>`;
  },
  async ask(q){
    if(!q||!q.trim())return;
    if(!this.open)this.toggle();
    this.msgs.push({html:`<div class="msg user">${q}</div>`});
    this.msgs.push({html:`<div class="msg ai"><span class="typing"><i></i><i></i><i></i></span></div>`});
    this.render();
    try{ // 1) live agent first
      const d=await this.askRemote(q);
      this.msgs.pop();
      this.msgs.push({html:`<div class="msg ai">${this.renderRemote(d)}</div>`});
      this.render();
    }catch(e){ // 2) any failure → existing local engine, exactly as before
      setTimeout(()=>{this.msgs.pop();this.msgs.push({html:`<div class="msg ai">${this.answer(q)}</div>`});this.render();},300);
    }
  },
  answer(q){
    const s=fleetStats(); q=q.toLowerCase();
    const ev=(...items)=>`<div class="ev">${items.join('')}</div>`;

      ${ev(chip('INC-1042 replay',"openIncident('INC-1042')"),chip('AMR-07 telemetry',"openRobot('AMR-07')"),chip('Throughput chart',"go('overview')"))}`;

        ta.value=md; ta.style.position='fixed'; ta.style.opacity='0';

function ackAllInfo(){

  list.forEach(a=>{a.ack=true;if(typeof Sync!=='undefined')Sync.ackAlert(a.id);});

/** Subsequence fuzzy match: -1 = no match, higher score = better. */
function fuzzyScore(q,s){
  q=q.toLowerCase(); s=s.toLowerCase();
  if(!q)return 0;
  let qi=0,score=0,last=-2;
  for(let i=0;i<s.length&&qi<q.length;i++){
    if(s[i]===q[qi]){score+=(i===last+1?3:1)+(i===0?4:0);last=i;qi++;}
  }
  return qi===q.length?score:-1;
}
const Palette={
  open:false, sel:0, items:[],
  toggle(){this.open?this.close():this.show();},
  show(){
    this.ensure(); this.open=true;
    $('#palette').classList.add('open');
    const i=$('#pal-in'); i.value=''; this.update(''); i.focus();
  },
  close(){this.open=false;const p=$('#palette');if(p)p.classList.remove('open');},
  ensure(){
    if($('#palette'))return;
    const d=document.createElement('div'); d.id='palette';
    d.innerHTML=`<div class="pal-box">
      <input id="pal-in" placeholder="Search views, robots, actions — or ask Sarathi…" autocomplete="off" spellcheck="false">
      <div id="pal-list"></div>
      <div class="pal-foot"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span><span style="margin-left:auto">⌘K palette · ⌘J copilot</span></div>
    </div>`;
    document.body.appendChild(d);
    d.addEventListener('mousedown',e=>{if(e.target===d)this.close();});
    const inp=$('#pal-in');
    inp.addEventListener('input',()=>this.update(inp.value));
    inp.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){e.preventDefault();this.move(1);}
      else if(e.key==='ArrowUp'){e.preventDefault();this.move(-1);}
      else if(e.key==='Enter'){e.preventDefault();this.run(this.sel);}
      else if(e.key==='Escape'){e.preventDefault();this.close();}
    });
  },
  base(){
    const it=[];
    [['overview','Overview'],['liveops','Live Ops'],['incidents','Incidents'],['missions','Missions'],
     ['maint','Maintenance'],['analytics','Analytics'],['fleet','Fleet & Connectors']]
      .forEach(([v,l])=>it.push({ic:'◫',label:'Go to '+l,hint:'view',run:()=>go(v)}));
    it.push({ic:'⎙',label:'Shift report',hint:'report',run:()=>ShiftReport.open()});
    it.push({ic:'✓',label:'Ack all info alerts',hint:'action',run:()=>ackAllInfo()});
    it.push({ic:'?',label:'Replay first-run tour',hint:'action',run:()=>Tour.start()});
    robots.forEach(r=>it.push({ic:'⬡',label:r.id+' — '+r.vendor,hint:'robot',run:()=>openRobot(r.id)}));
    return it;
  },
  update(q){
    const query=(q||'').trim();
    const list=this.base().map(it=>({it,sc:fuzzyScore(query,it.label)}))
      .filter(x=>x.sc>=0).sort((a,b)=>b.sc-a.sc).map(x=>x.it);
    if(query)list.push({ic:'✦',label:'Ask Sarathi: “'+query+'”',hint:'copilot',run:()=>Copilot.ask(query)});
    this.items=list; this.sel=0; this.paint();
  },
  paint(){
    const el=$('#pal-list'); if(!el)return;
    el.innerHTML=this.items.map((it,i)=>
      `<div class="pal-it${i===this.sel?' sel':''}" data-i="${i}"><i class="ic">${it.ic}</i>${Copilot.esc(it.label)}<span class="hint">${Copilot.esc(it.hint)}</span></div>`).join('')
      ||'<div class="pal-empty">No matches</div>';
    el.querySelectorAll('.pal-it').forEach(dv=>{
      dv.addEventListener('click',()=>this.run(+dv.dataset.i));
      dv.addEventListener('mousemove',()=>{if(this.sel!==+dv.dataset.i){this.sel=+dv.dataset.i;this.paint();}});
    });
  },
  move(d){
    if(!this.items.length)return;
    this.sel=(this.sel+d+this.items.length)%this.items.length; this.paint();
    const el=$('#pal-list .pal-it.sel'); if(el)el.scrollIntoView({block:'nearest'});
  },
  run(i){const it=this.items[i];if(!it)return;this.close();it.run();}
};

  ],
  seen(){try{return localStorage.getItem(this.KEY)==='1';}catch(e){return true;}},
  markSeen(){try{localStorage.setItem(this.KEY,'1');}catch(e){}},
  maybeStart(){if(!this.seen())setTimeout(()=>this.start(),600);},
  start(i){this.i=i||0;this.on=true;this.ensure();this.show();},
  ensure(){
    if($('#tour-block'))return;
    ['tour-block','tour-hl','tour-card'].forEach(id=>{
      const d=document.createElement('div');d.id=id;document.body.appendChild(d);});
  },
  show(){
    if(!this.on)return;
    const s=this.STEPS[this.i];
    if(s.view&&curView!==s.view)go(s.view);
    ['tour-block','tour-hl','tour-card'].forEach(id=>$('#'+id).style.display='block');
    setTimeout(()=>this.place(),60); // let the view render before measuring
  },
  place(){
    if(!this.on)return;
    const s=this.STEPS[this.i], hl=$('#tour-hl'), card=$('#tour-card');
    const el=s.sel?document.querySelector(s.sel):null;
    let r=el?el.getBoundingClientRect():null;
    if(r&&(r.width<12||r.height<12))r=null;   // empty target (e.g. no pending approvals) → centred card
    if(r){
      hl.style.left=(r.left-6)+'px'; hl.style.top=(r.top-6)+'px';
      hl.style.width=(r.width+12)+'px'; hl.style.height=(r.height+12)+'px';
    }else{
      hl.style.left=(innerWidth/2)+'px'; hl.style.top=(innerHeight/2)+'px';
      hl.style.width='0px'; hl.style.height='0px';
    }
    const last=this.i===this.STEPS.length-1;
    card.innerHTML=`<h4>${s.t}<span class="n">${this.i+1} / ${this.STEPS.length}</span></h4><p>${s.b}</p>
      <div class="row"><button class="btn ghost sm sk" id="tour-skip" onclick="Tour.done(false)">Skip tour</button>
      ${this.i?`<button class="btn sm" onclick="Tour.prev()">Back</button>`:''}
      <button class="btn sm primary" id="tour-next" onclick="Tour.next()">${last?'Finish':'Next →'}</button></div>`;
    // position the card near the highlight (below → above → centred)
    const cw=296, ch=card.offsetHeight||150;
    let x,y;
    if(r){
      x=Math.max(12,Math.min(innerWidth-cw-12,r.left+r.width/2-cw/2));
      y=r.bottom+16;
      if(y+ch>innerHeight-12)y=Math.max(12,r.top-ch-16);
    }else{x=(innerWidth-cw)/2;y=innerHeight/2-ch/2;}
    card.style.left=x+'px'; card.style.top=y+'px';
  },
  next(){if(this.i>=this.STEPS.length-1)return this.done(true);this.i++;this.show();},
  prev(){if(this.i>0){this.i--;this.show();}},
  done(finished){
    this.on=false; this.markSeen();
    ['tour-block','tour-hl','tour-card'].forEach(id=>{const e=$('#'+id);if(e)e.style.display='none';});
    if(curView!=='overview')go('overview');
    toast(finished?'Tour complete — replay it anytime with the ? button in the header':'Tour skipped — the ? button in the header replays it');
  }
};

/* ================= Supabase sync (polling PostgREST, leader-elected sim) ================= */
/* Backend is configurable via URL query params (defaults unchanged):
     ?supa=<PostgREST base url>  overrides SUPA_URL
     ?key=<anon key>             overrides SUPA_KEY
     ?site=<site id>             exposed as window.SITE (no filtering yet)   */
const _cfg=new URLSearchParams(location.search);
const SUPA_URL=_cfg.get('supa')||'https://flwyvhsmgrrqpmhcqlzd.supabase.co';
const SUPA_KEY=_cfg.get('key')||'sb_publishable_7rqvPRggmPDRKNL8Jurcqg_Hf531puf'; // publishable anon key — safe client-side
window.SITE=_cfg.get('site')||null;
const Sync={
  mode:'connecting',            // connecting | leader | follower | local
  me:'w-'+Math.random().toString(36).slice(2,10),
  lastPush:0,
  hdr(extra){return Object.assign({'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},extra||{});},
  async q(path,opt){ // fetch wrapper, 4s timeout
    const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);
    try{const r=await fetch(SUPA_URL+'/rest/v1/'+path,Object.assign({signal:c.signal},opt,{headers:this.hdr(opt&&opt.headers)}));
      clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const txt=await r.text();return txt?JSON.parse(txt):null;
    }catch(e){clearTimeout(t);throw e;}
  },
  setChip(){const d=$('#cloud-dot'),l=$('#cloud-lbl');if(!d)return;
    const m={leader:['var(--good)','Cloud: LIVE · simulating'],follower:['var(--s1)','Cloud: LIVE · viewing'],local:['var(--warn)','Local sim (offline)'],connecting:['var(--muted)','connecting…'],nodb:['var(--crit)','Run schema SQL ⇒ retry']};
    const[c,txt]=m[this.mode]||m.connecting;d.style.background=c;l.textContent=txt;},
  async init(){
    try{ await this.q('fleet_meta?select=id&limit=1'); }
    catch(e){ this.mode = String(e).includes('404')||String(e).includes('406')?'nodb':'local'; this.setChip();
      if(this.mode==='nodb')toast('⚠ Supabase reachable but schema missing — run fleetmind_schema.sql in the SQL Editor, then reload.');
      else toast('Supabase unreachable from this network — running local sim.');
      if(this.mode==='nodb')this.mode='local';
      return; }
    await this.claim(); this.setChip();
    // pull seeded incidents/missions once
    try{const inc=await this.q('incidents?select=*&order=created_at.desc');
      if(inc&&inc.length)store.incidents=inc.map(i=>({id:i.id,sev:i.sev,title:i.title,src:i.src,t:i.tlabel,state:i.state,impact:i.impact,rca:i.rca||'Automated detection (yantradetect) — root-cause analysis pending.',fix:i.fix||'Inspect the robot on the floor · acknowledge related alerts · ask the copilot for telemetry around the event.',dur:i.dur,created_at:i.created_at}));
      const ms=await this.q('missions?select=*&order=id');
      if(ms&&ms.length)store.missions=ms.map(m=>({id:m.id,name:m.name,robots:m.robots,state:m.state,prog:m.prog,eta:m.eta}));
    }catch(e){}
    setInterval(()=>this.cycle().catch(()=>{}),2000);
    setInterval(()=>this.claim().catch(()=>{}),10000); // failover check
    toast(this.mode==='leader'?'☁ Connected to Supabase — this tab is running the fleet':'☁ Connected — another tab is simulating; this one is a live viewer');
  },
  async claim(){
    try{
      const rows=await this.q('fleet_meta?id=eq.1&select=writer_id,updated_at');
      const row=rows&&rows[0];
      const stale=!row||!row.writer_id||(Date.now()-new Date(row.updated_at).getTime()>8000);
      const simWriter=row&&row.writer_id&&String(row.writer_id).startsWith('yantrasim');
      if(simWriter&&!stale){this.mode='follower';}                 // v0.2: a live simulator/robot feed always outranks the console
      else if(row&&row.writer_id===this.me){this.mode='leader';}
      else if(stale){ await this.q('fleet_meta?id=eq.1',{method:'PATCH',body:JSON.stringify({writer_id:this.me,updated_at:new Date().toISOString()})}); this.mode='leader'; }
      else this.mode='follower';
    }catch(e){ if(this.mode!=='local'){this.mode='local';} }
    this.setChip();
  },
  async cycle(){
    if(this.mode==='leader')await this.push(); else if(this.mode==='follower')await this.pull();
    await this.pullCommands();
    // v0.4: missions ride the sync cycle too (throttled — small table, every 3rd tick);
    // maintenance findings refresh only while the Maintenance view is open.
    this.cycleN=(this.cycleN||0)+1;
    if(this.cycleN%3===0){
      await this.pullMissions();
      // re-render missions only when visible and the operator isn't typing in the intent box
      if(curView==='missions'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))rMissions();
      if(curView==='maint')await this.pullFindings();  // render loop repaints maint every ~3s
    }
  },
  /* ---- v0.4 missions sync ---- */
  async pullMissions(){
    try{
      const ms=await this.q('missions?select=*&order=created_at.desc.nullslast&limit=30');
      if(ms&&ms.length)store.missions=ms.map(m=>({id:m.id,name:m.name,robots:Array.isArray(m.robots)?m.robots:[],state:m.state||'Queued',prog:m.prog!=null?+m.prog:0,eta:m.eta||'—'}));
    }catch(e){/* missions table optional — keep current rows */}
  },
  insertMission(m){ if(this.mode==='local'||this.mode==='connecting')return;
    this.q('missions',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({id:m.id,name:m.name,robots:m.robots,state:m.state,prog:m.prog,eta:m.eta})})
      .catch(()=>toast('⚠ Mission saved locally only (cloud insert failed)')); },
  /* ---- v0.4 maintenance findings (table may not exist → store.findings stays null → mock tickets) ---- */
  async pullFindings(){
    try{
      const rows=await this.q('maintenance_findings?select=*&order=created_at.desc.nullslast&limit=30');
      store.findings=(rows||[]).filter(f=>!f.state||/open/i.test(String(f.state)));
    }catch(e){ store.findings=null; }
  },
  /* ---- v0.2 command queue (human-in-the-loop gate) ---- */
  queueCommand(robotId,cmd){
    this.q('commands',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({robot_id:robotId,cmd,requested_by:'console:PN'})})
      .then(()=>this.pullCommands()).catch(()=>toast('⚠ Could not queue command (is 0002_commands.sql applied?)'));
  },
  async pullCommands(){
    try{
      const rows=await this.q('commands?select=*&status=in.(pending,approved)&order=created_at.asc&limit=12');
      store.commands=rows||[];
      const el=$('#ov-approvals'); if(el)renderApprovals(el);
    }catch(e){/* table may not exist yet — silently skip */}
  },
  decideCommand(id,decision){
    this.q('commands?id=eq.'+encodeURIComponent(id),{method:'PATCH',
      body:JSON.stringify({status:decision,decided_by:'console:PN',decided_at:new Date().toISOString()})})
      .then(()=>{toast('Command '+decision);this.pullCommands();})
      .catch(()=>toast('⚠ Decision failed'));
  },
  async push(){
    const rows=robots.map(r=>({id:r.id,vendor:r.vendor,status:r.status,battery:+r.battery.toFixed(1),
      pos:[+r.pos[0].toFixed(1),+r.pos[1].toFixed(1)],speed:+r.speed.toFixed(2),task_kind:r.task?r.task.kind:null,
      health:+r.health.toFixed(1),motor_temp:+r.motorTemp.toFixed(1),tasks_done:r.tasksDone,fault_msg:r.faultMsg||null,
      updated_at:new Date().toISOString()}));
    await this.q('robots?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
    await this.q('fleet_meta?id=eq.1',{method:'PATCH',body:JSON.stringify({writer_id:this.me,sim_min:simMin,throughput:store.throughput,updated_at:new Date().toISOString()})});
    // reflect acks made elsewhere
    try{const als=await this.q('alerts?select=id,ack&ack=eq.true&limit=40');
      if(als)als.forEach(a=>{const l=store.alerts.find(x=>x.id===a.id);if(l)l.ack=true;});}catch(e){}
  },
  async pull(){
    const rows=await this.q('robots?select=*');
    if(rows&&rows.length){
      rows.forEach(d=>{const r=robots.find(x=>x.id===d.id);if(!r)return;
        r.vendor=d.vendor||r.vendor;r.status=normStatus(d.status);
        if(d.battery!=null)r.battery=+d.battery;
        const np=posToSvg(d.pos);if(np)r.pos=np;
        if(d.speed!=null)r.speed=+d.speed;
        r.task=d.task_kind?{id:'T-live',kind:d.task_kind}:null;
        if(d.health!=null)r.health=+d.health;
        if(d.motor_temp!=null)r.motorTemp=+d.motor_temp;
        if(d.tasks_done!=null)r.tasksDone=d.tasks_done;
        r.faultMsg=d.fault_msg||null;
        r.spdHist.push(r.speed);if(r.spdHist.length>40)r.spdHist.shift();});
    }
    const meta=await this.q('fleet_meta?id=eq.1&select=sim_min,throughput');
    if(meta&&meta[0]){simMin=+meta[0].sim_min;store.throughput=meta[0].throughput;
      if(tick%4===0){store.thrHist.push({t:simMin,v:store.throughput});if(store.thrHist.length>60)store.thrHist.shift();}}
    const als=await this.q('alerts?select=*&order=created_at.desc&limit=25');
    if(als)store.alerts=als.map(a=>({id:a.id,sev:a.sev,msg:a.msg,src:a.src,t:a.tlabel||'—',ack:a.ack}));
    tick++;
  },
  insertAlert(a){ if(this.mode!=='leader')return;
    this.q('alerts',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:a.id,sev:a.sev,msg:a.msg,src:a.src,tlabel:clock2(a.t)})}).catch(()=>{}); },
  ackAlert(id){ if(this.mode==='local')return;
    this.q('alerts?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({ack:true})}).catch(()=>{}); },
  patchIncident(id,body){ if(this.mode==='local')return;
    this.q('incidents?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)}).catch(()=>{}); },
};

/* ================= Router + main loop ================= */
const VIEWS={overview:rOverview,liveops:rLiveOps,incidents:rIncidents,missions:rMissions,maint:rMaint,analytics:rAnalytics,fleet:rFleet};
let curView='overview';
function go(v){
  curView=v;
  $$('#nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $$('.view').forEach(x=>x.classList.remove('on'));
  $('#v-'+v).classList.add('on');
  closeDrawer(); render(true);
}
$$('#nav button[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='k'){e.preventDefault();Palette.toggle();}       // ⌘K → command palette
  else if((e.metaKey||e.ctrlKey)&&k==='j'){e.preventDefault();Copilot.toggle();}  // ⌘J → copilot panel
  else if(k==='escape'&&Palette.open)Palette.close();
});

let lastFull=0;
function render(force){
  const now=performance.now();
  // header chips always
  const s=fleetStats();
  $('#h-health').textContent=s.health+'/100';
  $('#chip-health .dot').style.background=s.health>=85?'var(--good)':s.health>=70?'var(--warn)':'var(--crit)';
  $('#h-alarmrate').textContent=store.alarmHr+' alarms/hr';
  $('#alarm-dot').style.background=store.alarmHr<=12?'var(--good)':'var(--crit)';
  $('#h-clock').textContent='🕐 '+clock();
  $('#n-inc').textContent=store.incidents.filter(i=>i.state==='Open').length||'';
  if(!store.incidents.some(i=>i.state==='Open'))$('#n-inc').classList.add('z');
  // live-ops map updates every frame; full view re-render throttled
  if(curView==='liveops'){updateMap();if(force||now-lastFull>2000){renderFleetList();lastFull=now;}}
  else if(force){VIEWS[curView]();lastFull=now;}
  else if(now-lastFull>3000&&['overview','analytics','maint'].includes(curView)){VIEWS[curView]();lastFull=now;} // never auto-rerender incidents (would reset replay scrub)
}
VIEWS.overview();rLiveOps();$('#v-liveops').classList.remove('on');$('#v-overview').classList.add('on');
setInterval(()=>{ if(Sync.mode!=='follower')step(0.4); render(false); },400);
Sync.init();
Tour.maybeStart();   // first visit only (localStorage-gated) — replay via the header ? button
setTimeout(()=>toast('👋 Tips: click AMR-07 (red, pulsing) on Live Ops · open INC-1042 replay · ⌘K palette · ⌘J Copilot'),1200);
</script>
