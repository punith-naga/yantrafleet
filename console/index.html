   SIBLING ../academy/index.html instead — computed via location so the link
   degrades gracefully. Serving console/ alone still 404s it — acceptable. */
function wireAcademyLink(){
  const a=$('#btn-academy');if(!a)return;
  const qs=new URLSearchParams();
  for(const k of ['supa','key','site','token']){const v=_cfg.get(k);if(v)qs.set(k,v);}
  const base=location.protocol==='file:'?'../academy/index.html':'academy/index.html';
  a.href=base+(qs.toString()?('?'+qs.toString()):'');
}
wireAcademyLink();

/* ================= YFAuth — real sign-in via Supabase Auth (v0.11) =================
   Demo-compatible: with no auth-gated backend nothing changes (anon key,
   legacy command paths). Against an RBAC backend (supabase/0007_rbac.sql):
     - login(email, password)  → POST {SUPA_URL}/auth/v1/token?grant_type=password
       (apikey = anon key); stores {jwt, refresh, email, role, site} in
       localStorage under 'yf_auth_v1' (try/catch — private mode safe).
     - role discovery         → own user_roles row (rbac_user_roles_self_read),
       falling back to the JWT's yf_role claim (fakerest test tokens and
       custom-claims setups), then 'operator' + a WARN toast. UI gating only —
       the backend RLS always decides what actually succeeds.
     - refreshToken()         → grant_type=refresh_token, single-flight;
       Sync.q retries a 401'd request once after a successful refresh.
     - logout()/expire()      → clear state + localStorage, back to anon.
   Sync marks the backend auth-required on any 401 seen while anonymous and
   shows the sign-in modal exactly once (no crash/prompt loops). */
const YFAuth={
  KEY:'yf_auth_v1',
  state:{jwt:null,refresh:null,email:null,role:null,site:null},
  _prompted:false,_refreshing:null,
  esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},
  authed(){return !!(this.state.jwt&&this.state.email);},
  canDecide(){return this.state.role==='manager'||this.state.role==='admin';},
  load(){try{const s=JSON.parse(localStorage.getItem(this.KEY)||'null');
    if(s&&typeof s==='object'&&s.jwt)this.state=Object.assign(this.state,s);}catch(e){}},
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.state));}catch(e){}},
  /** base64url JSON claims from segment [1] — fits both real Supabase JWTs
      (header.payload.sig) and fakerest 'yf-test.<claims>.sig' test tokens. */
  parseJwt(tok){try{const seg=String(tok||'').split('.');if(seg.length<2)return null;
    const b=seg[1].replace(/-/g,'+').replace(/_/g,'/');
    const j=JSON.parse(atob(b+'='.repeat((4-b.length%4)%4)));
    return j&&typeof j==='object'?j:null;}catch(e){return null;}},
  /** No /auth/v1 behind SUPA_URL (loopback fakerest 404s it, or the fetch
      itself fails) → a flagged error so the modal can explain demo mode
      instead of dumping a raw HTTP/network error. */
  NOAUTH_MSG:'Accounts need a real Supabase backend — you are on the local demo (loopback). Continue in demo mode.',
  async _authPost(path,body){
    let r;
    try{
      r=await fetch(SUPA_URL+path,{method:'POST',
        headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
        body:JSON.stringify(body)});
    }catch(e){const err=new Error(this.NOAUTH_MSG);err.noAuth=true;throw err;}
    if(r.status===404){const err=new Error(this.NOAUTH_MSG);err.noAuth=true;throw err;}
    return r;
  },
  /** Adopt a GoTrue token response as the live session (login or instant signup). */
  async _adoptSession(d,email,greeting){
    this.state={jwt:d.access_token,refresh:d.refresh_token||null,
      email:(d.user&&d.user.email)||email,role:null,site:null};
    await this.fetchRole();
    this.save();this.renderHeader();
    if(typeof Sync!=='undefined')Sync.onAuthChange();
    toast(greeting+this.state.email+' · role: '+(this.state.role||'none'));
  },
  async login(email,password){
    const r=await this._authPost('/auth/v1/token?grant_type=password',{email,password});
    const d=await r.json().catch(()=>null);
    if(!r.ok||!d||!d.access_token)
      throw new Error((d&&(d.error_description||d.msg||d.message))||('Sign-in failed (HTTP '+r.status+')'));
    await this._adoptSession(d,email,'Signed in as ');
  },
  /* v0.12: create account → POST {SUPA_URL}/auth/v1/signup. Three real
     Supabase outcomes: session returned (email confirmation OFF) → logged in
     now, resolves 'session'; user but no session (confirmation ON — the
     Supabase default) → resolves 'confirm'; error (weak password / already
     registered / signups disabled) → throws with the server's message. */
  async signup(email,password){
    const r=await this._authPost('/auth/v1/signup',{email,password});
    const d=await r.json().catch(()=>null);
    if(!r.ok)
      throw new Error((d&&(d.error_description||d.msg||d.message))||('Sign-up failed (HTTP '+r.status+')'));
    if(d&&d.access_token){await this._adoptSession(d,email,'Account created — signed in as ');return 'session';}
    const u=(d&&d.user)||d;                     // GoTrue returns the bare user when confirmation is on
    if(u&&(u.id||u.email||u.confirmation_sent_at))return 'confirm';
    throw new Error('Unexpected reply from the auth server');
  },
  /** Role/site for the header badge and UI gating (see module comment). */
  async fetchRole(){
    try{ // 0007 own-row policy: authenticated users can read exactly their row
      const rows=await Sync.q('user_roles?select=role,site_id&limit=1');
      if(Array.isArray(rows)&&rows[0]&&rows[0].role){
        this.state.role=rows[0].role;this.state.site=rows[0].site_id||this.state.site;return;}
    }catch(e){/* table absent (test backends) or unreadable → claims fallback */}
    const c=this.parseJwt(this.state.jwt);
    if(c&&c.yf_role){this.state.role=c.yf_role;this.state.site=c.site_id||this.state.site;return;}
    this.state.role='operator';
    toast('⚠ WARN: no role found for your account — assuming operator in the UI only (the backend still enforces real permissions, so a role-less account effectively views). Ask your admin to assign a role (docs/SECURITY.md)');
  },
  /** grant_type=refresh_token — single-flight so parallel 401s refresh once. */
  refreshToken(){
    if(this._refreshing)return this._refreshing;
    const p=(async()=>{
      if(!this.state.refresh)throw new Error('no refresh token');
      const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
        headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({refresh_token:this.state.refresh})});
      const d=await r.json().catch(()=>null);
      if(!r.ok||!d||!d.access_token)throw new Error('refresh failed (HTTP '+r.status+')');
      this.state.jwt=d.access_token;
      if(d.refresh_token)this.state.refresh=d.refresh_token;
      this.save();
    })().finally(()=>{this._refreshing=null;});
    this._refreshing=p;return p;
  },
  logout(){
    this.state={jwt:null,refresh:null,email:null,role:null,site:null};
    try{localStorage.removeItem(this.KEY);}catch(e){}
    this._prompted=false;this.renderHeader();
    if(typeof Sync!=='undefined')Sync.onAuthChange();
    toast('Signed out');
  },
  /** Session died server-side (401 + failed refresh) → drop it, re-prompt. */
  expire(){
    this.state={jwt:null,refresh:null,email:null,role:null,site:null};
    try{localStorage.removeItem(this.KEY);}catch(e){}
    this._prompted=false;this.renderHeader();this.promptOnce();
  },
  /** Called by Sync on an unauthenticated 401 — open the modal exactly once. */
  promptOnce(){if(!this.authed()&&!this._prompted){this._prompted=true;this.show();}},
  renderHeader(){
    const el=$('#auth-box');if(!el)return;
    el.innerHTML=this.authed()
      ?`<span class="chip" id="auth-user" title="Signed in via Supabase Auth">👤 ${this.esc(this.state.email)}
          <span class="role-badge" id="auth-role">${this.esc(this.state.role||'…')}</span></span>
        <button class="btn ghost sm" id="btn-signout" onclick="YFAuth.logout()">Sign out</button>`
      :`<button class="btn sm" id="btn-signin" onclick="YFAuth.show()">Sign in</button>`;
    // v0.13: the Settings nav entry is admin-only — every auth state
    // transition (login/logout/expiry) already routes through here.
    const nb=$('#nav-settings'); if(nb) nb.style.display=(this.state.role==='admin')?'':'none';
  },
  mode:'in',                                    // 'in' = sign in · 'up' = create account
  ensure(){
    if($('#signin'))return;
    const d=document.createElement('div');d.id='signin';
    d.innerHTML=`<div class="si-box">
      <h2>Account <button class="btn ghost sm" style="margin-left:auto" onclick="YFAuth.close()">✕</button></h2>
      <div class="si-sub">FleetMind console · Supabase Auth</div>
      <div class="si-tabs" role="tablist">
        <button class="si-tab on" id="si-tab-in" role="tab" onclick="YFAuth.setMode('in')">Sign in</button>
        <button class="si-tab" id="si-tab-up" role="tab" onclick="YFAuth.setMode('up')">Create account</button>
      </div>
      <label for="si-email">Email</label><input id="si-email" type="email" autocomplete="username" spellcheck="false">
      <label for="si-pass">Password</label><input id="si-pass" type="password" autocomplete="current-password">
      <label for="si-pass2" id="si-pass2-lbl" hidden>Confirm password</label>
      <input id="si-pass2" type="password" autocomplete="new-password" hidden>
      <div id="si-err"></div>
      <div id="si-msg"></div>
      <button class="btn primary" id="si-submit">Sign in</button>
      <div class="si-foot"><span style="color:var(--muted)" id="si-note">Roles are enforced server-side (RLS)</span>
        <a id="si-demo" onclick="YFAuth.close();toast('Continuing in demo mode — anonymous access')">Continue in demo mode</a></div>
    </div>`;
    document.body.appendChild(d);
    d.addEventListener('mousedown',e=>{if(e.target===d)this.close();});
    $('#si-submit').addEventListener('click',()=>this.submit());
    ['si-email','si-pass','si-pass2'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')this.submit();}));
  },
  setMode(m){
    this.mode=m;this.ensure();
    $('#si-tab-in').classList.toggle('on',m==='in');
    $('#si-tab-up').classList.toggle('on',m==='up');
    $('#si-submit').textContent=m==='up'?'Create account':'Sign in';
    $('#si-pass').setAttribute('autocomplete',m==='up'?'new-password':'current-password');
    $('#si-pass2-lbl').hidden=$('#si-pass2').hidden=m!=='up';
    if(m!=='up')$('#si-pass2').value='';
    $('#si-note').textContent=m==='up'
      ?'New accounts may need a role assigned before data shows — see docs/SECURITY.md'
      :'Roles are enforced server-side (RLS)';
    $('#si-err').textContent='';$('#si-msg').textContent='';
  },
  show(){
    this.ensure();
    // 'continue in demo mode' only while the backend still allows anon —
    // once a 401 marked it auth-required the link would just mislead.
    const demo=$('#si-demo');if(demo)demo.style.display=(typeof Sync!=='undefined'&&Sync.authRequired)?'none':'';
    this.setMode(this.mode);
    $('#signin').classList.add('open');
    const em=$('#si-email');if(em)em.focus();
  },
  close(){const d=$('#signin');if(d)d.classList.remove('open');},
  async submit(){
    const email=($('#si-email').value||'').trim(),pass=$('#si-pass').value||'';
    const err=$('#si-err'),msg=$('#si-msg'),btn=$('#si-submit');
    const up=this.mode==='up',lbl=up?'Create account':'Sign in';
    if(!email||!pass){err.textContent='Email and password are required';return;}
    if(up&&pass!==($('#si-pass2').value||'')){err.textContent='Passwords do not match';return;}
    btn.disabled=true;btn.textContent=up?'Creating account…':'Signing in…';
    err.textContent='';msg.textContent='';
    try{
      if(up){
        const out=await this.signup(email,pass);
        if(out==='session')this.close();          // (a) session returned → signed in
        else msg.textContent='Account created — check your email to confirm, then sign in. '
          +'(Project owners: disable Confirm email in Supabase → Authentication → Sign In / Up '
          +'for instant signup.)';                 // (b) user, no session
      }else{await this.login(email,pass);this.close();}
    }catch(e){
      if(e&&e.noAuth){msg.textContent=e.message;  // no /auth/v1 → demo-mode note, not an error dump
        const demo=$('#si-demo');if(demo)demo.style.display='';}
      else err.textContent=String((e&&e.message)||e);  // (c) friendly server message
    }
    finally{btn.disabled=false;btn.textContent=lbl;}
  }
};
YFAuth.load();

const Sync={
  mode:'connecting',            // connecting | leader | follower | local | auth
  me:'w-'+Math.random().toString(36).slice(2,10),
  lastPush:0,
  authRequired:false,           // v0.11: set on the first 401 — backend enforces RBAC
  /* v0.12 empty-fleet detection: backend reachable (follower mode — a live
     writer holds fleet_meta) but the robots table has stayed empty for a
     while (fresh real Supabase, no sim/bridge publishing). The Overview
     shows a friendly "start the simulator" card instead of stale charts.
     READ-ONLY — the console never auto-writes anything to fix it. */
  robotsEmptySince:null, EMPTY_AFTER_MS:10000,
  noteRobots(rows){
    if(Array.isArray(rows)&&rows.length===0){
      if(this.robotsEmptySince==null)this.robotsEmptySince=Date.now();
    }else this.robotsEmptySince=null;
  },
  emptyFleet(){
    return this.mode==='follower'&&this.robotsEmptySince!=null
      &&Date.now()-this.robotsEmptySince>=this.EMPTY_AFTER_MS;
  },
  /** apikey is ALWAYS the anon key (PostgREST convention); Authorization
      carries the user JWT once signed in, else the anon key as before. */
  hdr(extra){
    const bearer=(typeof YFAuth!=='undefined'&&YFAuth.state.jwt)?YFAuth.state.jwt:SUPA_KEY;
    return Object.assign({'apikey':SUPA_KEY,'Authorization':'Bearer '+bearer,'Content-Type':'application/json'},extra||{});},
  async q(path,opt,_retried){ // fetch wrapper, 4s timeout; one refresh-retry on 401
    const c=new AbortController();const t=setTimeout(()=>c.abort(),4000);
    try{const r=await fetch(SUPA_URL+'/rest/v1/'+path,Object.assign({signal:c.signal},opt,{headers:this.hdr(opt&&opt.headers)}));
      clearTimeout(t);
      if(r.status===401&&typeof YFAuth!=='undefined'){
        this.authRequired=true;
        if(!_retried&&YFAuth.state.jwt&&YFAuth.state.refresh){
          try{await YFAuth.refreshToken();}
          catch(e2){YFAuth.expire();const err=new Error('HTTP 401');err.status=401;throw err;}
          return await this.q(path,opt,true);           // retried exactly once
        }
        if(YFAuth.state.jwt)YFAuth.expire();            // token dead, no refresh left
        else YFAuth.promptOnce();                        // anon on an RBAC backend
        const err=new Error('HTTP 401');err.status=401;throw err;
      }
      if(!r.ok){const err=new Error('HTTP '+r.status);err.status=r.status;throw err;}
      const txt=await r.text();return txt?JSON.parse(txt):null;
    }catch(e){clearTimeout(t);throw e;}
  },
  setChip(){const d=$('#cloud-dot'),l=$('#cloud-lbl');if(!d)return;
    const m={leader:['var(--good)','Cloud: LIVE · simulating'],follower:['var(--s1)','Cloud: LIVE · viewing'],local:['var(--warn)','Local sim (offline)'],connecting:['var(--muted)','connecting…'],nodb:['var(--crit)','Run schema SQL ⇒ retry'],auth:['var(--warn)','Sign in required']};
    const[c,txt]=m[this.mode]||m.connecting;d.style.background=c;l.textContent=txt;},
  /* v0.11: identity changed (sign-in/out) — re-elect and re-pull with the new headers */
  onAuthChange(){
    if(typeof YFAuth!=='undefined'&&YFAuth.authed()){
      this.mode='connecting';this.setChip();
      this.claim().then(()=>this.pullSeed()).then(()=>this.cycle()).catch(()=>{});
    }else{
      if(this.authRequired)this.mode='auth';
      this.setChip();
    }
    render(true);
  },
  async init(){
    try{ await this.q('fleet_meta?select=id&limit=1'); }
    catch(e){ this.mode = String(e).includes('404')||String(e).includes('406')?'nodb':'local'; this.setChip();
      if(this.mode==='nodb')toast('⚠ Supabase reachable but schema missing — run fleetmind_schema.sql in the SQL Editor, then reload.');
      else toast('Supabase unreachable from this network — running local sim.');
      if(this.mode==='nodb')this.mode='local';
      return; }
    await this.claim(); this.setChip();
    await this.pullSeed();
    setInterval(()=>this.cycle().catch(()=>{}),2000);
    setInterval(()=>this.claim().catch(()=>{}),10000); // failover check
    if(this.mode!=='auth')toast(this.mode==='leader'?'☁ Connected to Supabase — this tab is running the fleet':'☁ Connected — another tab is simulating; this one is a live viewer');
  },
  /* pull seeded incidents/missions (on connect, and again after sign-in) */
  async pullSeed(){
    try{const inc=await this.q('incidents?select=*&order=created_at.desc');
      if(inc&&inc.length)store.incidents=inc.map(i=>({id:i.id,sev:i.sev,title:i.title,src:i.src,t:i.tlabel,state:i.state,impact:i.impact,rca:i.rca||'Automated detection (yantradetect) — root-cause analysis pending.',fix:i.fix||'Inspect the robot on the floor · acknowledge related alerts · ask the copilot for telemetry around the event.',dur:i.dur,created_at:i.created_at}));
      const ms=await this.q('missions?select=*&order=id');
      if(ms&&ms.length)store.missions=ms.map(m=>({id:m.id,name:m.name,robots:m.robots,state:m.state,prog:m.prog,eta:m.eta}));
    }catch(e){}
  },
  async claim(){
    // RBAC backend + still anonymous: nothing to elect — wait for sign-in.
    if(this.authRequired&&typeof YFAuth!=='undefined'&&!YFAuth.authed()){this.mode='auth';this.setChip();return;}
    try{
      const rows=await this.q('fleet_meta?id=eq.1&select=writer_id,updated_at');
      const row=rows&&rows[0];
      const stale=!row||!row.writer_id||(Date.now()-new Date(row.updated_at).getTime()>8000);
      const simWriter=row&&row.writer_id&&String(row.writer_id).startsWith('yantrasim');
      if(simWriter&&!stale){this.mode='follower';}                 // v0.2: a live simulator/robot feed always outranks the console
      else if(row&&row.writer_id===this.me){this.mode='leader';}
      else if(stale){
        try{ await this.q('fleet_meta?id=eq.1',{method:'PATCH',body:JSON.stringify({writer_id:this.me,updated_at:new Date().toISOString()})}); this.mode='leader'; }
        catch(e){ // RBAC backends: fleet_meta writes are service-only
          if(e&&e.status===401&&typeof YFAuth!=='undefined'&&!YFAuth.authed())this.mode='auth';
          else if(e&&(e.status===401||e.status===403))this.mode='follower'; // signed in: view-only
          else throw e;
        }
      }
      else this.mode='follower';
    }catch(e){
      if(e&&e.status===401&&typeof YFAuth!=='undefined'&&!YFAuth.authed())this.mode='auth';
      else if(this.mode!=='local'){this.mode='local';}
    }
    this.setChip();
  },
  async cycle(){
    // anonymous against an RBAC backend: reads are empty and writes 401 —
    // idle quietly until sign-in instead of hammering the API.
    if(this.mode==='auth'&&typeof YFAuth!=='undefined'&&!YFAuth.authed())return;
    if(this.mode==='leader')await this.push(); else if(this.mode==='follower')await this.pull();
    await this.pullCommands();
    // v0.4: missions ride the sync cycle too (throttled — small table, every 3rd tick);
    // maintenance findings refresh only while the Maintenance view is open.
    this.cycleN=(this.cycleN||0)+1;
    if(this.cycleN%3===0){
      await this.pullMissions();
      // re-render missions only when visible and the operator isn't typing in the intent box
      if(curView==='missions'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))rMissions();
      if(curView==='maint')await this.pullFindings();  // render loop repaints maint every ~3s
      if(curView==='audit')await this.pullAudit();     // ditto for the audit trail
    }
  },
  /* ---- v0.9 audit trail: full command history, all statuses ---- */
  async pullAudit(){
    try{
      const rows=await this.q('commands?select=*&order=created_at.desc&limit=50');
      store.audit=rows||[];
    }catch(e){/* commands table may not exist — keep store.audit as-is (null → graceful empty state) */}
  },
  /* ---- v0.4 missions sync ---- */
  async pullMissions(){
    try{
      const ms=await this.q('missions?select=*&order=created_at.desc.nullslast&limit=30');
      if(ms&&ms.length)store.missions=ms.map(m=>({id:m.id,name:m.name,robots:Array.isArray(m.robots)?m.robots:[],state:m.state||'Queued',prog:m.prog!=null?+m.prog:0,eta:m.eta||'—'}));
    }catch(e){/* missions table optional — keep current rows */}
  },
  insertMission(m){ if(this.mode==='local'||this.mode==='connecting')return;
    this.q('missions',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({id:m.id,name:m.name,robots:m.robots,state:m.state,prog:m.prog,eta:m.eta})})
      .catch(()=>toast('⚠ Mission saved locally only (cloud insert failed)')); },
  /* ---- v0.4 maintenance findings (table may not exist → store.findings stays null → mock tickets) ---- */
  async pullFindings(){
    try{
      const rows=await this.q('maintenance_findings?select=*&order=created_at.desc.nullslast&limit=30');
      store.findings=(rows||[]).filter(f=>!f.state||/open/i.test(String(f.state)));
    }catch(e){ store.findings=null; }
  },
  /* ---- v0.2 command queue (human-in-the-loop gate) ---- */
  queueCommand(robotId,cmd){
    // v0.11: signed-in users request as themselves (0007 WITH CHECK requires it)
    const who=(typeof YFAuth!=='undefined'&&YFAuth.authed())?YFAuth.state.email:'console:PN';
    this.q('commands',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({robot_id:robotId,cmd,requested_by:who})})
      .then(()=>this.pullCommands()).catch(()=>toast('⚠ Could not queue command (is 0002_commands.sql applied?)'));
  },
  async pullCommands(){
    try{
      const rows=await this.q('commands?select=*&status=in.(pending,approved)&order=created_at.asc&limit=12');
      store.commands=rows||[];
      const el=$('#ov-approvals'); if(el)renderApprovals(el);
    }catch(e){/* table may not exist yet — silently skip */}
  },
  decideCommand(id,decision){
    // v0.11: signed in → the 0007 decide_command RPC (server checks manager+
    // and the pending-only state machine). Anonymous / demo → legacy PATCH.
    if(typeof YFAuth!=='undefined'&&YFAuth.authed()){
      this.q('rpc/decide_command',{method:'POST',
        body:JSON.stringify({p_id:id,p_decision:decision})})
        .then(()=>{toast('Command '+decision);this.pullCommands();})
        .catch(e=>toast('⚠ Decision failed'+(e&&e.status===403?' — requires the manager or admin role':'')));
      return;
    }
    this.q('commands?id=eq.'+encodeURIComponent(id),{method:'PATCH',
      body:JSON.stringify({status:decision,decided_by:'console:PN',decided_at:new Date().toISOString()})})
      .then(()=>{toast('Command '+decision);this.pullCommands();})
      .catch(()=>toast('⚠ Decision failed'));
  },
  /* ---- v0.13 admin settings panel (supabase/0008_app_settings.sql) ---- */
  async loadAppSettings(){
    try{ store.appSettings=await this.q('rpc/admin_list_settings',{method:'POST',body:'{}'}); }
    catch(e){ store.appSettings=[]; if(e&&e.status===403)toast('⚠ Settings requires the admin role'); }
  },
  saveAppSetting(key,value){
    return this.q('rpc/admin_set_setting',{method:'POST',
      body:JSON.stringify({p_key:key,p_value:value})});
  },
  async push(){
    this.robotsEmptySince=null;   // leader mode publishes robots itself
    const rows=robots.map(r=>({id:r.id,vendor:r.vendor,status:r.status,battery:+r.battery.toFixed(1),
      pos:[+r.pos[0].toFixed(1),+r.pos[1].toFixed(1)],speed:+r.speed.toFixed(2),task_kind:r.task?r.task.kind:null,
      health:+r.health.toFixed(1),motor_temp:+r.motorTemp.toFixed(1),tasks_done:r.tasksDone,fault_msg:r.faultMsg||null,
      updated_at:new Date().toISOString()}));
    await this.q('robots?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rows)});
    await this.q('fleet_meta?id=eq.1',{method:'PATCH',body:JSON.stringify({writer_id:this.me,sim_min:simMin,throughput:store.throughput,updated_at:new Date().toISOString()})});
    // reflect acks made elsewhere
    try{const als=await this.q('alerts?select=id,ack&ack=eq.true&limit=40');
      if(als)als.forEach(a=>{const l=store.alerts.find(x=>x.id===a.id);if(l)l.ack=true;});}catch(e){}
  },
  async pull(){
    const rows=await this.q('robots?select=*');
    this.noteRobots(rows);
    if(rows&&rows.length){
      rows.forEach(d=>{const r=robots.find(x=>x.id===d.id);if(!r)return;
        r.vendor=d.vendor||r.vendor;r.status=normStatus(d.status);
        if(d.battery!=null)r.battery=+d.battery;
        const np=posToSvg(d.pos);if(np)r.pos=np;
        if(d.speed!=null)r.speed=+d.speed;
        r.task=d.task_kind?{id:'T-live',kind:d.task_kind}:null;
        if(d.health!=null)r.health=+d.health;
        if(d.motor_temp!=null)r.motorTemp=+d.motor_temp;
        if(d.tasks_done!=null)r.tasksDone=d.tasks_done;
        r.faultMsg=d.fault_msg||null;
        r.spdHist.push(r.speed);if(r.spdHist.length>40)r.spdHist.shift();});
    }
    const meta=await this.q('fleet_meta?id=eq.1&select=sim_min,throughput');
    if(meta&&meta[0]){simMin=+meta[0].sim_min;store.throughput=meta[0].throughput;
      if(tick%4===0){store.thrHist.push({t:simMin,v:store.throughput});if(store.thrHist.length>60)store.thrHist.shift();}}
    const als=await this.q('alerts?select=*&order=created_at.desc&limit=25');
    if(als)store.alerts=als.map(a=>({id:a.id,sev:a.sev,msg:a.msg,src:a.src,t:a.tlabel||'—',ack:a.ack}));
    tick++;
  },
  insertAlert(a){ if(this.mode!=='leader')return;
    this.q('alerts',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({id:a.id,sev:a.sev,msg:a.msg,src:a.src,tlabel:clock2(a.t)})}).catch(()=>{}); },
  ackAlert(id){ if(this.mode==='local')return;
    this.q('alerts?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({ack:true})}).catch(()=>{}); },
  patchIncident(id,body){ if(this.mode==='local')return;
    this.q('incidents?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)}).catch(()=>{}); },
};

/* ================= Router + main loop ================= */
const VIEWS={overview:rOverview,liveops:rLiveOps,incidents:rIncidents,missions:rMissions,maint:rMaint,analytics:rAnalytics,fleet:rFleet,audit:rAudit,settings:rSettings};
let curView='overview';
function go(v){
  // v0.13: UI-level defense in depth — the RPC's own yf_has_role('admin')
  // check is the real gate; this just avoids flashing the settings view
  // at a non-admin before the RPC 403 comes back.
  if(v==='settings'&&!(typeof YFAuth!=='undefined'&&YFAuth.state.role==='admin')){
    toast('⚠ Settings requires the admin role');v='overview';
  }
  curView=v;
  $$('#nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $$('.view').forEach(x=>x.classList.remove('on'));
  $('#v-'+v).classList.add('on');
  closeDrawer(); render(true);
}
$$('#nav button[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='k'){e.preventDefault();Palette.toggle();}       // ⌘K → command palette
  else if((e.metaKey||e.ctrlKey)&&k==='j'){e.preventDefault();Copilot.toggle();}  // ⌘J → copilot panel
  else if(k==='escape'&&Palette.open)Palette.close();
});

let lastFull=0;
function render(force){
  const now=performance.now();
  // header chips always
  const s=fleetStats();
  $('#h-health').textContent=s.health+'/100';
  $('#chip-health .dot').style.background=s.health>=85?'var(--good)':s.health>=70?'var(--warn)':'var(--crit)';
  $('#h-alarmrate').textContent=store.alarmHr+' alarms/hr';
  $('#alarm-dot').style.background=store.alarmHr<=12?'var(--good)':'var(--crit)';
  $('#h-clock').textContent='🕐 '+clock();
  $('#n-inc').textContent=store.incidents.filter(i=>i.state==='Open').length||'';
  if(!store.incidents.some(i=>i.state==='Open'))$('#n-inc').classList.add('z');
  // live-ops map updates every frame; full view re-render throttled
  if(curView==='liveops'){updateMap();if(force||now-lastFull>2000){renderFleetList();lastFull=now;}}
  else if(force){VIEWS[curView]();lastFull=now;}
  else if(now-lastFull>3000&&['overview','analytics','maint','audit'].includes(curView)){VIEWS[curView]();lastFull=now;} // never auto-rerender incidents (would reset replay scrub)
}
VIEWS.overview();rLiveOps();$('#v-liveops').classList.remove('on');$('#v-overview').classList.add('on');
YFAuth.renderHeader();   // v0.11: Sign in button / signed-in identity chip
{const vc=$('#yf-version');if(vc)vc.textContent='YantraFleet v'+YF_VERSION;}
sampleAvail();   // seed one availability sample so the SLA card never starts empty
setInterval(()=>{ if(Sync.mode!=='follower')step(0.4); sampleAvail(); render(false); },400);
Sync.init();
Tour.maybeStart();   // first visit only (localStorage-gated) — replay via the header ? button
setTimeout(()=>toast('👋 Tips: click AMR-07 (red, pulsing) on Live Ops · open INC-1042 replay · ⌘K palette · ⌘J Copilot'),1200);
</script>
