[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yantraops"
version = "0.1.0"
description = "One-command orchestrator for the YantraFleet demo stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# The real robot-data path: `up --mqtt` (paho for the sim/connector clients,
# amqtt for the embedded loopback broker).
mqtt = ["paho-mqtt>=2", "amqtt>=0.11"]

[tool.setuptools.packages.find]
include = ["yantraops*"]
