[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yantradetect"
version = "0.1.0"
description = "Fleet incident detector: fault/estop edge detection -> incidents table (PostgREST)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "yantracore",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
yantradetect = "yantradetect.__main__:main"

[tool.setuptools]
packages = ["yantradetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
